<!DOCTYPE html>
<html lang="en">

<head>
  https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Da(ta) Vinci Code</title>


 <style>
   body {
     margin: 0;
     padding: 0;
     overflow: hidden;
     background: #000;
     font-family: 'Cormorant Garamond', serif;
   }

 .page-container {
   position: relative;
   width: 100vw;
   height: 100vh;
 }

 .hero-image {
   width: 100%;
   height: 100%;
   object-fit: cover;
 }

  .title {
    position: absolute;
    top: 3%;
    width: 100%;
    text-align: center;
    font-family: 'Cinzel', serif;
    font-size: 3rem;
    color: #f0e3c0;
    text-shadow: 2px 2px 8px black;
  }

 .letter-container {
   position: absolute;
   top: 46.5%;
   left: 49.6%;
   transform: translateX(-50%);
   display: flex;
   gap: 30px;
 }

 .letter-box {
   width: 42px;
   height: 42px;
   text-align: center;
   font-size: 32px;
   text-transform: uppercase;
   font-family: 'Cinzel', serif;
   background: rgba(255,255,255,0.1);
   border: 2px solid red;
   padding: 0;
 }

 .submit-container {
   position: absolute;
   top: 75%;
   width: 100%;
   text-align: center;
 }

 button {
   font-family: 'Cinzel', serif;
   padding: 12px 24px;
   cursor: pointer;
   background: #d8c3a5;
   border: 2px solid #6b4f2a;
 }

 #attempts {
   color: white;
   font-size: 1.5rem;
   text-shadow: 2px 2px 4px black;
 }

 .popup-overlay {
   position: fixed;
   inset: 0;
   background: rgba(0,0,0,.8);
   display: none;
   justify-content: center;
   align-items: center;
   z-index: 999;
 }

 .popup {
   background: #efe1b0;
   padding: 40px;
   border: 6px solid #6b4f2a;
   text-align: center;
   max-width: 600px;
 }

 .popup h1 {
   font-family: 'Cinzel', serif;
 }

 .countdown {
   font-size: 2rem;
   font-weight: bold;
 }

 </style>
</head>

<body>
  
  <div class="page-container">
    
    <img src="CryptexImage.png"
      class="hero-image"
      alt="Cryptext">
    
    <div class="title">
      The Da(ta) Vinci Code
    </div>
    
    <div class="letter-container">
      
      <input class="letter-box" maxlength="1" id="l1">
      <input class="letter-box" maxlength="1" id="l2">
      <input class="letter-box" maxlength="1" id="l3">
      <input class="letter-box" maxlength="1" id="l4">
      <input class="letter-box" maxlength="1" id="l5">
    
    </div>
    
    <div class="submit-container">
      
      <button onclick="checkAnswer()">
        Submit
      </button>
      
      <p id="attempts">
        Attempts Remaining: 3
      </p>
   
    </div>
  
  </div>
  
  <div class="popup-overlay" id="successPopup">
    
    <div class="popup">
      
      <h1>Congratulations!</h1>
      
      <h2>
        You have solved the Da(ta) Vinci Code!
      </h2>
      
      <p>
        Redirecting to the survey in:
      </p>
      <div class="countdown" id="countdown">
        10
      </div>
    
    </div>
  
  </div>
  
  <div class="popup-overlay" id="failurePopup">
    
    <div class="popup">
      
      <h1>Better Luck Next Time</h1>
      
      <button onclick="location.reload()">
        Try Again
      </button>
    
    </div>
  
  </div>

<script>
  
  let attempts = 3;
  
  const answer = "APPLE";
  
  document.querySelectorAll('.letter-box').forEach((box, index, boxes) => {
    
    box.addEventListener('input', function () {
      
      this.value = this.value.toUpperCase();
      
      if (this.value.length === 1 && index < boxes.length - 1) {
        boxes[index + 1].focus();
      }
    
    });
  
  });

function checkAnswer() {
  
  const enteredWord =
    document.getElementById('l1').value +
    document.getElementById('l2').value +
    document.getElementById('l3').value +
    document.getElementById('l4').value +
    document.getElementById('l5').value;
  
  if (enteredWord === answer) {
    
    document.getElementById('successPopup').style.display = 'flex';
    
    let countdown = 10;
    
    const timer = setInterval(() => {
      
      countdown--;
      
      document.getElementById('countdown').innerText =
        
        countdown;
      
      if (countdown === 0) {
        
        clearInterval(timer);
        
        window.location.href =
          "https://forms.cloud.microsoft/e/dvKH8AEYTF";
      
      }
    
    }, 1000);
    
    return;
  }
  attempts--;
  
  document.getElementById('attempts').innerText =
    
    "Attempts Remaining: " + attempts;
  
  if (attempts <= 0) {
    
    document.getElementById('failurePopup').style.display =
      'flex';
  
  }

}
  
</script>

</body>

</html>
