<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Da(ta) Vinci Code</title>

 <style>
   
   body {
     font-family: 'Cormorant Garamond', serif;
     text-align: center;
     background: #f5f0e1;
     color: #3e2c1c;
     margin: 0;
     padding: 20px;
   }

 h1 {
   font-family: 'Cinzel', serif;
   font-size: 3rem;
   letter-spacing: 3px;
   margin-bottom: 20px;
 }

 h2 {
   font-family: 'Cormorant Garamond', serif;
   font-size: 2rem;
 }

 p {
   font-size: 1.4rem;
}

 .codex {
   width: 900px;
   max-width: 100%;
   margin: auto;
   position: relative;
}

 .codex img {
   width: 100%;
   display: block;
   border-radius: 8px;
}

.input-box {
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
}

 input {
   font-family: 'Cinzel', serif;
   font-size: 28px;
   text-transform: uppercase;
   width: 200px;
   text-align: center;
   padding: 10px;
   border: 2px solid #6b4f2a;
   background: rgba(255, 248, 220, 0.9);
   color: #3e2c1c;
}

button {
  font-family: 'Cinzel', serif;
  font-size: 1rem;
  padding: 12px 24px;
  margin-top: 12px;
  border: 2px solid #6b4f2a;
  background: #d8c3a5;
  color: #3e2c1c;
  cursor: pointer;
}

 button:hover {
   background: #c7ae8a;
}

 #attempts {
   font-size: 1.3rem;
   font-weight: bold;
   margin-top: 12px;
}

 </style>
</head>

<body>
  
  <h1>The Da(ta) Vinci Code</h1>
  
  <div class="codex">
    
    <img src="CryptexImage.png" alt="ass="input-box">
    
    <input
      id="answer"
      maxlength="5"
      autocomplete="off"
      placeholder="ENTER">
    
    <br>
    
    <button onclick="checkAnswer()">
      Submit
    </button>
    
    <p id="attempts">
      Attempts Remaining: 3
    </p>
  
  </div>

</div>

<script>
  
  let attempts = 3;
  
  const answer = "APPLE";
  
  function checkAnswer() {
    
    const userAnswer = document
      .getElementById("answer")
      .value
      .trim()
      .toUpperCase();
    
    if (userAnswer === answer) {
      
      document.body.innerHTML = `
      <h1>Congratulations!</h1>
      <h2>You have solved the Da(ta) Vinci Code!</h2>
      <p>Redirecting to the survey in 10 seconds...</p>
      `;
      
      setTimeout(function () {
        
        window.location.href = "FORM_URL_HERE";
      
      }, 10000);
      
      return;
    }
    
    attempts--;
    
    document.getElementById("attempts").innerText =
      "Attempts Remaining: " + attempts;
    
    if (attempts <= 0) {
      
      document.body.innerHTML = `
      <h1>Better Luck Next Time</h1>
      <p>The code remains unsolved.</p>
      
      <button onclick="location.reload()">
      Try Again
      </button>
      `;
    }
  }
  
</script>

</body>

</html>
